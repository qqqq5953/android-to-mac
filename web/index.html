<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>傳到 Mac</title>
  </head>
  <body>
    <main>
      <h1 id="title">傳到 Mac</h1>
      <label class="picker">
        選擇照片、影片或檔案
        <input id="picker" type="file" multiple hidden />
      </label>
      <div id="groups">
        <section class="group" data-status="uploading" hidden>
          <div class="group-header"><h2>上傳中 <span class="count"></span></h2></div>
          <ul></ul>
        </section>
        <section class="group" data-status="error" hidden>
          <div class="group-header"><h2>失敗 <span class="count"></span></h2></div>
          <ul></ul>
        </section>
        <section class="group" data-status="waiting" hidden>
          <div class="group-header"><h2>等待中 <span class="count"></span></h2></div>
          <ul></ul>
        </section>
        <section class="group" data-status="done" hidden>
          <div class="group-header">
            <h2>已完成 <span class="count"></span></h2>
            <button id="clear-done" type="button">清除已完成</button>
          </div>
          <ul></ul>
        </section>
      </div>
    </main>

    <template id="item-template">
      <li>
        <span class="name"></span>
        <span class="actions">
          <span class="meta"></span>
          <button class="retry" type="button">重試</button>
          <button class="remove" type="button" aria-label="移除">✕</button>
        </span>
        <progress max="1" value="0"></progress>
      </li>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
